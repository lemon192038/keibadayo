function makeBg(W,H){
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 let s=12345;const rnd=()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296};
 const gr=g.createRadialGradient(W/2,H/2,60,W/2,H/2,W*.65);gr.addColorStop(0,'#e3d3a2');gr.addColorStop(.6,'#c8b685');gr.addColorStop(1,'#8f9a7a');g.fillStyle=gr;g.fillRect(0,0,W,H);
 for(let i=0;i<2200;i++){g.fillStyle='rgba('+(rnd()<.5?'255,250,220':'120,100,60')+','+(.05+rnd()*.12)+')';g.fillRect(rnd()*W,rnd()*H,1+rnd()*2,1+rnd()*2)}
 const pal=[['#2c7f6a','#1a5446'],['#3da58a','#236e5c'],['#7aa63a','#4c6e22'],['#c24a73','#7c2748'],['#d6764a','#8c4326'],['#5b6fb8','#34417a'],['#8a4fa8','#573066']];
 const clus=(cx,cy,rad,n)=>{for(let i=0;i<n;i++){const a=rnd()*6.28,d=rnd()*rad,x=cx+Math.cos(a)*d,y2=cy+Math.sin(a)*d,r=7+rnd()*20,p=pal[Math.floor(rnd()*pal.length)];
  g.fillStyle='rgba(0,20,20,.3)';g.beginPath();g.arc(x+5,y2+6,r,0,7);g.fill();
  const rg=g.createRadialGradient(x-r*.3,y2-r*.3,1,x,y2,r);rg.addColorStop(0,p[0]);rg.addColorStop(1,p[1]);g.fillStyle=rg;g.beginPath();g.arc(x,y2,r,0,7);g.fill()}};
 [[50,60],[90,170],[40,300],[70,430],[200,25],[420,15],[620,30],[760,70],[760,230],[740,470],[560,490],[30,490]].forEach(c=>clus(c[0],c[1],70,16));
 return c;
}
function drawFish(g,x,y,ang,len,ph,amp,mode,cl,alpha,tone){
 const N=14,top=[],bot=[],sp=[];
 for(let i=0;i<=N;i++){const t=i/N,px=len*(.5-t),py=Math.sin(ph-t*4.5)*amp*len*.12*t*(.4+t),w=len*.15*Math.sin(Math.PI*Math.pow(t*.92+.04,.75))*(1-.4*t);
  sp.push([px,py]);top.push([px,py-w]);bot.push([px,py+w])}
 g.save();g.translate(x,y);g.rotate(ang);
 const col=mode=='shadow'?'rgba('+((tone&&tone.c)||'3,12,20')+','+(alpha==null?.8:alpha)+')':null;
 if(tone&&tone.glow){g.shadowColor=tone.glow;g.shadowBlur=24}else if(mode=='shadow'){g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=9}
 const fin=pts=>{g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=col||cl[0];g.fill()};
 const e=sp[N],fl=Math.sin(ph*1.3)*len*.04;
 fin([[e[0],e[1]],[e[0]-len*.22,e[1]-len*.18+fl],[e[0]-len*.14,e[1]],[e[0]-len*.22,e[1]+len*.18+fl]]);
 const a=top[4],b2=bot[4];
 fin([[a[0],a[1]],[a[0]-len*.15,a[1]-len*.11-fl],[a[0]-len*.05,a[1]+len*.02]]);
 fin([[b2[0],b2[1]],[b2[0]-len*.15,b2[1]+len*.11+fl],[b2[0]-len*.05,b2[1]-len*.02]]);
 g.beginPath();g.moveTo(len*.53,0);top.forEach(p=>g.lineTo(p[0],p[1]));for(let i=N;i>=0;i--)g.lineTo(bot[i][0],bot[i][1]);g.closePath();
 if(col)g.fillStyle=col;else{const gd=g.createLinearGradient(0,-len*.16,0,len*.16);gd.addColorStop(0,cl[0]);gd.addColorStop(.55,cl[1]);gd.addColorStop(1,'#fff');g.fillStyle=gd}
 g.fill();g.shadowBlur=0;
 if(!col){g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1.2;g.stroke();g.fillStyle='#111';g.beginPath();g.arc(len*.38,-len*.045,Math.max(1.5,len*.018),0,7);g.arc(len*.38,len*.045,Math.max(1.5,len*.018),0,7);g.fill()}
 g.restore();
}
function fishDraw(g,x,y,ang,len,ph,amp,cls,alpha,t){

 else drawFish(g,x,y,ang,len,ph,amp,'shadow',null,alpha,TONE[cls]||TONE.ノーマル);
}

 const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};

 };
 const ripple=(x,y2,sp,mx)=>{S.ripple.push({x:x,y:y2,r:2,sp:sp,mx:mx})};
 function lureAt(x,y2,s){g.fillStyle='#fff';g.beginPath();g.arc(x,y2,6*s,0,7);g.fill();g.fillStyle='#e33';g.beginPath();g.arc(x,y2,3.5*s,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=1;g.beginPath();g.arc(x,y2,6*s,0,7);g.stroke()}

  const dn=SGS.find(s=>s.idx==SG.dest),dg=SG.dg&&typeof SG.dg=='object'?SG.dg:null;
  h+='<p>'+(1+Math.floor(SG.turn/12))+'年目 '+((SG.turn%12)+1)+'月 / 所持金 <b class=c>'+y(SG.money)+'万円</b> / 物件 '+SG.props.length+'/8 '+(SG.god>0?' / 👹 <b style="color:#f66">'+GODN[SG.god]+'</b>':'')+'</p>'
   +'<p>🎯 目的地: <b>'+esc(dn?dn.name:'?')+'</b>(あと道のり'+SG.dist+'マス以上・基礎ボーナス '+y(SG.dist*400)+'万円)</p>';
  if(SG.props.length)h+='<p><small>🏠 '+SG.props.map(p=>esc(p.n)).join(' / ')+'</small></p>';
  h+='<div id=sgr></div>';
  if(dg){
   h+='<div class=card style="background:#2a1a3a"><b>🎯 目的地ゲーム!</b><br>終了の目は <b class=c>'+dg.a+'</b> と <b class=c>'+dg.b+'</b>。この目が出るまで振り続けます(外れた回数×1.5×基礎ボーナス)。<br>これまで外れ '+dg.n+'回<br><button class=on onclick="dgRoll()" style="font-size:20px">🎲 サイコロを振る</button></div>';
  }else{
   h+='<button class=on onclick="roll()" style="font-size:20px">🎲 サイコロを振る</button>';
   h+='<div>'+(SG.cards||[]).map(c=>{const d=SGC[c.c];if(!d)return '';return '<button onclick="'+(d.ctype=='dice'?'roll('+c.c+')':'useCard('+c.c+')')+'">🃏 '+esc(d.name)+' ×'+c.u+'</button>'}).join('')+'</div>';
  }
  h+='<button class=s onclick="quit()">🏁 ここで終了して精算</button>';
 }else{
  h+='<p>'+(SG&&SG.over?'<b class=c>終了! 🪙'+y(SG.pay)+'を獲得</b>':'東京をスタートに36か月プレイします。物件は8つ集まると決算で収入になります。最終資産の(1億円を超えた分÷2)がコインになります(上限10万)。')+'</p><button class=on onclick="sgStart()">🚃 スタート(無料)</button>';
 }
 h+='<div id=sgl>'+SGLOG.map(l=>'<div><small>'+esc(l)+'</small></div>').join('')+'</div>';
 h+='<p><small>凡例: '+Object.keys(KIC).map(k=>KIC[k]+'='+KNM[k]).join(' / ')+'。サイコロの目の数だけ、自動で目的地に近づくように進みます。目的地にぴったり止まると、ボーナスと目的地ゲームです。貧乏神は、同時に遊んでいる別のプレイヤーが止まっている駅を通ると、その人に移ります。</small></p></div>';
 return h;
}
function drawMap(){
 const cv=$('#sgm');if(!cv)return;const g=cv.getContext('2d');
 g.fillStyle='#13405e';g.fillRect(0,0,760,760);
 g.fillStyle='#5f8a52';g.strokeStyle='#cde8c0';g.lineWidth=2;
 OUTL.forEach(o=>{g.beginPath();o.forEach((p,i)=>i?g.lineTo(px(p[0]),py(p[1])):g.moveTo(px(p[0]),py(p[1])));g.closePath();g.fill();g.stroke()});
 const M={};SGS.forEach(s=>M[s.idx]=s);
 g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.5;
 SGE.forEach(e=>{const a=M[e.a],b=M[e.b];if(!a||!b)return;g.beginPath();g.moveTo(px(a.lon),py(a.lat));g.lineTo(px(b.lon),py(b.lat));g.stroke()});
 g.font='10px sans-serif';
 SGS.forEach(s=>{g.fillStyle='#fff';g.beginPath();g.arc(px(s.lon),py(s.lat),7,0,7);g.fill();g.font='9px sans-serif';g.fillStyle='#000';g.textAlign='center';g.fillText(KIC[s.kind]||'',px(s.lon),py(s.lat)+3);
  g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=3;g.strokeText(s.name,px(s.lon),py(s.lat)+17);g.fillText(s.name,px(s.lon),py(s.lat)+17)});
 g.textAlign='left';
 if(SG){const d=M[SG.dest];if(d){g.fillStyle='#fc3';g.font='24px sans-serif';g.fillText('★',px(d.lon)-10,py(d.lat)-8)}
  const p=M[MP!=null?MP:SG.pos];if(p){g.fillStyle='rgba(255,40,40,.9)';g.beginPath();g.arc(px(p.lon),py(p.lat),11,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();g.font='14px sans-serif';g.fillStyle='#fff';g.fillText('🚃',px(p.lon)-8,py(p.lat)+5)}}
}
async function reelAnim(items,pick){
 const e=$('#sgr');if(!e||!items||!items.length)return;
 for(let i=0;i<18;i++){e.textContent='🎰 '+items[Math.floor(Math.random()*items.length)];beep(500+i*20,.04,'square',.03);await sleep(80)}
 e.innerHTML='<span class=c>→ '+esc(items[pick])+'</span>';fanfare();await sleep(600);
}
async function playRes(d){
 for(const p of (d.path||[])){MP=p;drawMap();beep(300+Math.random()*100,.05,'square',.03);await sleep(140)}
 MP=null;SG=d;drawMap();
 for(const e of (d.ev||[])){if(e.items)await reelAnim(e.items,e.pick);SGLOG.unshift(e.msg)}
 SGLOG=SGLOG.slice(0,14);
 await refresh();
}
async function sgStart(){const {data,error}=await sb.rpc('sg_start');if(error){alert(error.message);return}SG=data;SGLOG=['東京からスタート!'];render()}
async function roll(c){if(SGBUSY)return;SGBUSY=true;try{const {data,error}=await sb.rpc('sg_roll',{p_card:c||null});if(error)throw error;await playRes(data)}catch(e){alert(e.message)}SGBUSY=false}
async function useCard(c){if(SGBUSY)return;SGBUSY=true;try{const {data,error}=await sb.rpc('sg_use_card',{p_card:c});if(error)throw error;await playRes(data)}catch(e){alert(e.message)}SGBUSY=false}
async function dgRoll(){
 if(SGBUSY)return;SGBUSY=true;
 try{const {data,error}=await sb.rpc('sg_dg_roll');if(error)throw error;
  const e=$('#sgr');if(e){for(let i=0;i<10;i++){e.textContent='🎲 '+(1+Math.floor(Math.random()*6));beep(400,.04,'square',.03);await sleep(70)}e.textContent='🎲 '+data.r}
  await sleep(400);SGLOG.unshift('🎲'+data.r+' '+data.msg);
  if(data.forgive){const x=$('#sgr');if(x)x.innerHTML='<span class=c>✨ 女神はまだあなたを見捨ててはいない......</span>';beep(880,.5,'sine',.08);await sleep(1400)}
  if(data.end)fanfare();
  SG=data;await refresh();
 }catch(e){alert(e.message)}SGBUSY=false;
}
async function quit(){if(!confirm('ここで終了して精算しますか?'))return;const {data,error}=await sb.rpc('sg_quit');if(error){alert(error.message);return}SG=data;await refresh()}

/* ================= ハイ&ロー ================= */
function hl(){
 const bet=[100,500,1000,5000,10000];
 return '<div class=card><h3>🃏 ハイ&ロー</h3>'
 +(HL&&!HL.over?'<div style="font-size:60px;text-align:center">'+HL.c+'</div><p style="text-align:center">連続'+(HL.n||0)+'回'+(HL.win?' / 回収 🪙'+y(HL.win):'')+'</p>'
  +'<button class=on onclick="guess(true)">⬆ ハイ</button><button class=on onclick="guess(false)">⬇ ロー</button>'+((HL.n||0)>=1?'<button onclick="hlCash()">💰 回収する</button>':'')
  :'<p>'+(HL&&HL.over?(HL.cashed?'<b class=c>回収! +🪙'+y(HL.pay)+'</b>':'ハズレ…(次は '+HL.c+')'):'数字(1〜13)が次に高いか低いかを当てます。連続で当てるほど×1.8倍ずつ増えます。')+'</p><div>'+bet.map(b=>'<button onclick="hlStart('+b+')">🃏 '+y(b)+'で開始</button>').join('')+'</div>')
 +'</div>';
}
async function hlStart(b){const {data,error}=await sb.rpc('hl_start',{p_bet:b});if(error){alert(error.message);return}HL={c:data.c,n:0,bet:b};await refresh()}
async function guess(hi){const {data,error}=await sb.rpc('hl_guess',{p_hi:hi});if(error){alert(error.message);return}
 if(data.over)HL={c:data.c,over:true,bet:HL.bet};else HL={c:data.c,n:data.n,win:data.win,bet:HL.bet};await refresh()}
async function hlCash(){const {data,error}=await sb.rpc('hl_cash');if(error){alert(error.message);return}HL={over:true,cashed:true,pay:data.pay,c:'-'};await refresh()}
</script></body></html>
