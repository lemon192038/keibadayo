function makeBg(W,H){
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
 let s=12345;const rnd=()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296};
 const gr=g.createRadialGradient(W/2,H/2,60,W/2,H/2,W*.65);gr.addColorStop(0,'#e3d3a2');gr.addColorStop(.6,'#c8b685');gr.addColorStop(1,'#8f9a7a');g.fillStyle=gr;g.fillRect(0,0,W,H);
 for(let i=0;i<2200;i++){g.fillStyle='rgba('+(rnd()<.5?'255,250,220':'120,100,60')+','+(.05+rnd()*.12)+')';g.fillRect(rnd()*W,rnd()*H,1+rnd()*2,1+rnd()*2)}
 const pal=[['#2c7f6a','#1a5446'],['#3da58a','#236e5c'],['#7aa63a','#4c6e22'],['#c24a73','#7c2748'],['#d6764a','#8c4326'],['#5b6fb8','#34417a'],['#8a4fa8','#573066']];
 const clus=(cx,cy,rad,n)=>{for(let i=0;i<n;i++){const a=rnd()*6.28,d=rnd()*rad,x=cx+Math.cos(a)*d,y2=cy+Math.sin(a)*d,r=7+rnd()*20,p=pal[Math.floor(rnd()*pal.length)];
  g.fillStyle='rgba(0,20,20,.3)';g.beginPath();g.arc(x+5,y2+6,r,0,7);g.fill();
  const rg=g.createRadialGradient(x-r*.3,y2-r*.3,1,x,y2,r);rg.addColorStop(0,p[0]);rg.addColorStop(1,p[1]);g.fillStyle=rg;g.beginPath();g.arc(x,y2,r,0,7);g.fill()}};
 [[50,60],[90,170],[40,300],[70,430],[200,25],[420,15],[620,30],[760,70],[760,230],[740,470],[560,490],[30,490]].forEach(c=>clus(c[0],c[1],70,16));
 return c;
}
function drawFish(g,x,y,ang,len,ph,amp,mode,cl,alpha,tone){
 const N=14,top=[],bot=[],sp=[];
 for(let i=0;i<=N;i++){const t=i/N,px2=len*(.5-t),py2=Math.sin(ph-t*4.5)*amp*len*.12*t*(.4+t),w=len*.15*Math.sin(Math.PI*Math.pow(t*.92+.04,.75))*(1-.4*t);
  sp.push([px2,py2]);top.push([px2,py2-w]);bot.push([px2,py2+w])}
 g.save();g.translate(x,y);g.rotate(ang);
 const col=mode=='shadow'?'rgba('+((tone&&tone.c)||'3,12,20')+','+(alpha==null?.8:alpha)+')':null;
 if(tone&&tone.glow){g.shadowColor=tone.glow;g.shadowBlur=24}else if(mode=='shadow'){g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=9}
 const fin=pts=>{g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=col||cl[0];g.fill()};
 const e=sp[N],fl=Math.sin(ph*1.3)*len*.04;
 fin([[e[0],e[1]],[e[0]-len*.22,e[1]-len*.18+fl],[e[0]-len*.14,e[1]],[e[0]-len*.22,e[1]+len*.18+fl]]);
 const a=top[4],b2=bot[4];
 fin([[a[0],a[1]],[a[0]-len*.15,a[1]-len*.11-fl],[a[0]-len*.05,a[1]+len*.02]]);
 fin([[b2[0],b2[1]],[b2[0]-len*.15,b2[1]+len*.11+fl],[b2[0]-len*.05,b2[1]-len*.02]]);
 g.beginPath();g.moveTo(len*.53,0);top.forEach(p=>g.lineTo(p[0],p[1]));for(let i=N;i>=0;i--)g.lineTo(bot[i][0],bot[i][1]);g.closePath();
 if(col)g.fillStyle=col;else{const gd=g.createLinearGradient(0,-len*.16,0,len*.16);gd.addColorStop(0,cl[0]);gd.addColorStop(.55,cl[1]);gd.addColorStop(1,'#fff');g.fillStyle=gd}
 g.fill();g.shadowBlur=0;
 if(!col){g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1.2;g.stroke();g.fillStyle='#111';g.beginPath();g.arc(len*.38,-len*.045,Math.max(1.5,len*.018),0,7);g.arc(len*.38,len*.045,Math.max(1.5,len*.018),0,7);g.fill()}
 g.restore();
}

 else drawFish(g,x,y,ang,len,ph,amp,'shadow',null,alpha,TONE[cls]||TONE.ノーマル);
}

  d:.9,hp:1,hpMax:1,tension:0,k:0,fl:0,wt:0,wt0:1,bt:0,res:null,raf:0,hf:null,flash:0,arcs:[],lt:{t:0,x:0,y:0},lastP:false,pulling:false,pt:2,dmg:null,combo:0};
 const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};

  }catch(e){alert(e.message);S.st='idle'}
 };
 const ripple=(x,y2,sp,mx)=>{S.ripple.push({x:x,y:y2,r:2,sp:sp,mx:mx})};
 function lureAt(x,y2,s){g.fillStyle='#fff';g.beginPath();g.arc(x,y2,6*s,0,7);g.fill();g.fillStyle='#e33';g.beginPath();g.arc(x,y2,3.5*s,0,7);g.fill();g.strokeStyle='#222';g.lineWidth=1;g.beginPath();g.arc(x,y2,6*s,0,7);g.stroke()}
 function line(x,y2){g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1.4;g.beginPath();g.moveTo(PL.x,PL.y);g.quadraticCurveTo((PL.x+x)/2,(PL.y+y2)/2,x,y2);g.stroke()}
 function loop(now){

 [[140.0,41.5],[141.0,41.8],[141.2,42.5],[143.3,42.0],[145.5,43.3],[145.2,44.0],[143.5,44.3],[142.0,45.5],[141.6,45.5],[141.6,43.8],[140.3,43.3],[139.9,42.7]],
 [[132.4,33.8],[133.3,34.2],[134.2,34.3],[134.7,34.1],[134.3,33.6],[133.6,33.3],[132.9,32.9],[132.4,33.4]],
 [[130.9,33.9],[131.9,33.6],[131.9,32.8],[131.5,31.4],[130.7,31.0],[130.2,31.4],[130.2,32.5],[129.7,32.7],[129.7,33.3],[130.4,33.6]],
 [[127.6,26.1],[127.9,26.1],[127.9,26.5],[127.7,26.7],[127.6,26.4]]];
const px=lon=>(lon-126)*36+20,py=lat=>(46.2-lat)*34+10;
let MP=null,SGLOG=[],SGBUSY=false,SGI={};
let ZM={x:380,y:360,s:3};
let SGK={raf:0,load:false,hits:[],panel:null,ov:false,reel:null,dice:null,big:null,toast:null};

function sg(){
 return '<div class=card style="padding:6px"><canvas id=sgm width=800 height=620></canvas>'
 +'<p><small>操作はすべて画面内のボタンで行います。サイコロを振るたびに🪙'+SGCOST+'かかります。🟦お金が増える/🟥お金が減る/🟨カード/🏠物件/🟪貧乏神/⚓️港/💰宝くじ/満=カード回数満タン/❇️貧乏神退散/🎲もう一回。ズーム中は、近い16マスだけを表示します。「🗾全体」で日本全体を見られます。</small></p></div>';
}
function drawMap(){initSG()}
async function loadSGMap(){
 const pg=async(t,o)=>{let out=[],p=0;for(;;){let q=sb.from(t).select('*');o.forEach(c=>{q=q.order(c)});const {data,error}=await q.range(p*1000,p*1000+999);if(error||!data)break;out=out.concat(data);if(data.length<1000)break;p++}return out};
 const [s,e]=await Promise.all([pg('sg_st',['idx']),pg('sg_edge',['a','b'])]);
 if(s.length)SGS=s;SGE=e.filter(x=>x.a<x.b);SGI={};SGS.forEach(x=>{SGI[x.idx]=x});
}
function initSG(){
 const cv=$('#sgm');if(!cv)return;
 if(SGK.raf)cancelAnimationFrame(SGK.raf);
 if(!SGK.load){SGK.load=true;loadSGMap()}
 if(!Object.keys(SGI).length)SGS.forEach(x=>{SGI[x.idx]=x});
 cv.onpointerdown=e=>{e.preventDefault();const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*620/r.height;
  for(let i=SGK.hits.length-1;i>=0;i--){const h=SGK.hits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){h.f();break}}};
 const g=cv.getContext('2d');
 const loop=t=>{if(!$('#sgm')||tab!='sg'){SGK.raf=0;return}try{drawSG(g,t/1000)}catch(e){console.error(e)}SGK.raf=requestAnimationFrame(loop)};
 SGK.raf=requestAnimationFrame(loop);
}
function btn(g,x,y,w,h,label,f,col,dis){
 g.fillStyle=dis?'#345':(col||'#1d5a7a');g.fillRect(x,y,w,h);g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(x,y,w,h);
 g.fillStyle=dis?'#789':(col=='#d4a017'?'#000':'#fff');g.font='bold 17px sans-serif';g.textAlign='center';g.fillText(label,x+w/2,y+h/2+6);g.textAlign='left';
 if(!dis)SGK.hits.push({x,y,w,h,f});
}
function block(){SGK.hits.push({x:0,y:0,w:800,h:620,f:()=>{}})}
function panelBox(g,x,y,w,h,title){
 g.fillStyle='rgba(5,15,30,.92)';g.fillRect(x,y,w,h);g.strokeStyle='#fc3';g.lineWidth=3;g.strokeRect(x,y,w,h);
 g.fillStyle='#fc3';g.font='bold 22px sans-serif';g.textAlign='center';g.fillText(title,x+w/2,y+36);g.textAlign='left';
}
function text(g,s,x,y,sz,col,al){g.font=(sz||16)+'px sans-serif';g.fillStyle=col||'#fff';g.textAlign=al||'left';g.fillText(s,x,y);g.textAlign='left'}

/* 貧乏神のドット絵 */
const GODC=[null,['#b9a6e8','#6a4fa8'],['#a8714a','#5b3418'],['#f08ab4','#9b3a68'],['#d94a3a','#7a1a12'],['#4fb06a','#1d5a30'],['#f1c232','#8a6a00']];
const GODSC=[0,.7,.9,1,1.15,1.3,1.5];
const GODB=["...oooooo...","..oOOOOOOo..",".oOwOOOOwOo.",".oOOOOOOOOo.",".oORRRRRROo.","..oOOOOOOo..",".oOOOOOOOOo.","oOOOoOOoOOOo","oOO.oOOo.OOo","..oOo..oOo..","..ooo..ooo.."];
function drawGod(g,cx,cy,size,rank,t){
 if(!rank)return;
 const c=GODC[rank],p=size*GODSC[rank]/12,bob=Math.sin(t*3)*p*.8,x0=cx-6*p,y0=cy-5.5*p+bob;
 g.fillStyle='rgba(80,0,120,.35)';g.beginPath();g.ellipse(cx,cy+6*p+bob,7*p,2*p,0,0,7);g.fill();
 GODB.forEach((row,j)=>{for(let i=0;i<12;i++){const ch=row[i];if(ch=='.')continue;g.fillStyle=ch=='o'?c[1]:ch=='O'?c[0]:ch=='w'?'#fff':'#d22';g.fillRect(x0+i*p,y0+j*p,p+.5,p+.5)}});
 g.fillStyle='#111';g.fillRect(x0+3*p,y0+2*p,p,p);g.fillRect(x0+8*p,y0+2*p,p,p);
 if(rank>=3){g.fillStyle='#fff';g.fillRect(x0+2*p,y0-p,p,p);g.fillRect(x0+9*p,y0-p,p,p);if(rank>=4){g.fillRect(x0+2*p,y0-2*p,p,p);g.fillRect(x0+9*p,y0-2*p,p,p)}}
 if(rank==5){g.fillStyle='#fc3';g.fillRect(x0+11*p,y0+6*p,3*p,3*p);g.fillStyle='#a60';g.fillRect(x0+12*p,y0+7*p,p,p)}
 if(rank==6){g.fillStyle='#fd4';g.fillRect(x0+2*p,y0-2*p,8*p,p*1.5);[2,4,6,8].forEach(i=>g.fillRect(x0+i*p,y0-3.2*p,p,p*1.3));g.fillStyle='#e22';g.fillRect(x0+5*p,y0-2*p,p,p)}
}

function drawSG(g,t){
 SGK.hits=[];const W=800,H=620;
 g.fillStyle='#13405e';g.fillRect(0,0,W,H);
 const live=!!(SG&&!SG.over&&SG.god!==undefined);
 const cur=SG?SGI[MP!=null?MP:SG.pos]:null;
 const ov=SGK.ov||!live;
 const ts=ov?.85:18,tx=ov?380:(cur?px(cur.lon):380),ty=ov?360:(cur?py(cur.lat):360);
 ZM.s+=(ts-ZM.s)*.1;ZM.x+=(tx-ZM.x)*.25;ZM.y+=(ty-ZM.y)*.25;
 const S=ZM.s,zoomed=S>6,scr=(x,y)=>[400+(x-ZM.x)*S,300+(y-ZM.y)*S];
 /* 陸地 */
 g.fillStyle='#4f8a4a';g.strokeStyle='#cde8c0';g.lineWidth=2;
 OUTL.forEach(o=>{g.beginPath();o.forEach((p,i)=>{const q=scr(px(p[0]),py(p[1]));i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])});g.closePath();g.fill();g.stroke()});
 /* 表示するマス */
 let set=SGS;
 if(zoomed){const c=[];for(const s of SGS){const dx=px(s.lon)-ZM.x,dy=py(s.lat)-ZM.y,d=dx*dx+dy*dy;if(d<900)c.push([d,s])}
  c.sort((a,b)=>a[0]-b[0]);set=c.slice(0,16).map(x=>x[1]);
  if(cur&&!set.includes(cur)){set.pop();set.push(cur)}}
 const inS=zoomed?new Set(set.map(s=>s.idx)):null;
 g.strokeStyle='#d8c8a0';g.lineWidth=zoomed?S*1.1:2.2;
 for(const e of SGE){if(zoomed&&!(inS.has(e.a)&&inS.has(e.b)))continue;const a=SGI[e.a],b=SGI[e.b];if(!a||!b)continue;
  const A=scr(px(a.lon),py(a.lat)),B=scr(px(b.lon),py(b.lat));if(A[0]<-50&&B[0]<-50||A[0]>850&&B[0]>850)continue;g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.stroke()}
 if(zoomed){g.strokeStyle='#443';g.setLineDash([6,10]);g.lineWidth=3;
  for(const e of SGE){if(!(inS.has(e.a)&&inS.has(e.b)))continue;const a=SGI[e.a],b=SGI[e.b];if(!a||!b)continue;const A=scr(px(a.lon),py(a.lat)),B=scr(px(b.lon),py(b.lat));g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.stroke()}g.setLineDash([])}
 for(const s of set){const q=scr(px(s.lon),py(s.lat));if(q[0]<-60||q[0]>860||q[1]<-60||q[1]>680)continue;
  const named=!!s.name,cs=zoomed?(named?5.4:4.6)*S:(named?5.5:4.4)*S+(named?1:.5);
  if(zoomed){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(q[0]-cs/2+4,q[1]-cs/2+6,cs,cs)}
  g.fillStyle=COLK[s.kind]||'#999';g.fillRect(q[0]-cs/2,q[1]-cs/2,cs,cs);
  if(zoomed||cs>5){g.strokeStyle='#fff';g.lineWidth=zoomed?3:1;g.strokeRect(q[0]-cs/2,q[1]-cs/2,cs,cs)}
  if(zoomed){g.font=(cs*.55)+'px sans-serif';g.textAlign='center';g.fillStyle='#000';g.fillText(KIC[s.kind]||'',q[0],q[1]+cs*.2);
   if(named){g.font='bold 15px sans-serif';g.lineWidth=4;g.strokeStyle='#fff';g.strokeText(s.name,q[0],q[1]-cs/2-6);g.fillStyle='#222';g.fillText(s.name,q[0],q[1]-cs/2-6)}g.textAlign='left'}}
 /* 目的地・コマ・貧乏神 */
 if(SG&&live){const d=SGI[SG.dest];
  if(d){const q=scr(px(d.lon),py(d.lat));
   if(q[0]>30&&q[0]<770&&q[1]>70&&q[1]<530){g.font=(ov?22:50)+'px sans-serif';g.textAlign='center';g.fillStyle='#fc3';g.strokeStyle='#000';g.lineWidth=4;g.strokeText('★',q[0],q[1]-(ov?6:50));g.fillText('★',q[0],q[1]-(ov?6:50));
    if(ov){g.font='bold 14px sans-serif';g.strokeStyle='#fff';g.lineWidth=3;g.strokeText(d.name,q[0],q[1]+18);g.fillStyle='#a30';g.fillText(d.name,q[0],q[1]+18)}g.textAlign='left'}
   else{const a=Math.atan2(q[1]-300,q[0]-400),ex=clamp(400+Math.cos(a)*340,40,760),ey=clamp(300+Math.sin(a)*230,90,520);g.fillStyle='#fc3';g.font='bold 18px sans-serif';g.textAlign='center';g.fillText('★'+d.name+' ▶',ex,ey);g.textAlign='left'}}}
 if(cur){const q=scr(px(cur.lon),py(cur.lat)),cs=zoomed?5*S:7,r=zoomed?cs*.42:7;
  if(SG&&live&&SG.god>0)drawGod(g,q[0]+(zoomed?cs*.45:12),q[1]-(zoomed?cs*.75:14),zoomed?cs*1.25:34,SG.god,t);
  g.fillStyle='rgba(255,40,40,.95)';g.beginPath();g.arc(q[0],q[1],r,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();
  g.font=(r*1.4)+'px sans-serif';g.textAlign='center';g.fillStyle='#fff';g.fillText('🚃',q[0],q[1]+r*.5);g.textAlign='left'}
 /* HUD */
 g.fillStyle='rgba(0,10,25,.82)';g.fillRect(0,0,W,58);
 if(live){const dn=SGI[SG.dest];
  text(g,(1+Math.floor(SG.turn/12))+'年目 '+((SG.turn%12)+1)+'月　所持金 '+y(SG.money)+'万円　物件 '+SG.props.length+'/8'+(SG.god>0?'　👹'+GODN[SG.god]:''),10,24,17,'#fc3');
  text(g,'🎯 '+(dn?dn.name:'?')+'(道のり'+SG.dist+'マス・基礎ボーナス '+y(SG.dist*400)+'万円)',10,48,14);
 }else text(g,'🚃 日本地図すごろく',10,34,20,'#fc3');
 text(g,'🪙 '+y(P?P.coins:0),800-10,34,20,'#ffd34d','right');
 /* ログ */
 if(SGLOG.length){g.fillStyle='rgba(0,10,25,.6)';g.fillRect(0,438,430,92);SGLOG.slice(0,5).forEach((l,i)=>text(g,l.slice(0,44),8,456+i*17,13,i?'#9bd':'#fff'))}
 /* 下のボタン */
 const busy=SGBUSY,dg=live&&SG.dg&&typeof SG.dg=='object'?SG.dg:null;
 if(live&&!dg){
  g.fillStyle='rgba(0,10,25,.85)';g.fillRect(0,540,W,80);
  btn(g,8,548,244,64,'🎲 サイコロ(🪙'+SGCOST+')',()=>roll(),'#d4a017',busy||SGK.panel);
  btn(g,260,548,150,64,'🃏 カード('+(SG.cards||[]).length+')',()=>{SGK.panel='cards'},null,busy||SGK.panel);
  btn(g,418,548,150,64,SGK.ov?'📍 ズーム':'🗾 全体',()=>{SGK.ov=!SGK.ov},null,SGK.panel);
  btn(g,576,548,216,64,'🏁 終了して精算',()=>{SGK.panel='quit'},'#a33',busy||SGK.panel);
 }
 /* 目的地ゲーム */
 if(dg&&!SGK.panel){
  block();panelBox(g,150,150,500,300,'🎯 目的地ゲーム!');
  text(g,'終了の目は 【'+dg.a+'】 と 【'+dg.b+'】',400,205,22,'#fff','center');
  text(g,'この目が出るまで振り続けます(外れ回数×1.5×基礎ボーナス)',400,235,14,'#9bd','center');
  text(g,'ここまでの外れ: '+dg.n+'回　基礎ボーナス '+y(dg.base)+'万円',400,262,16,'#fc3','center');
  if(SGK.dice!=null)text(g,'🎲 '+SGK.dice,400,350,64,'#fff','center');
  btn(g,300,380,200,56,'🎲 振る',()=>dgRoll(),'#d4a017',busy);
 }
 /* スタート/結果 */
 if(!live){
  block();panelBox(g,120,150,560,300,'🚃 日本地図すごろく');
  if(SG&&SG.over){text(g,'終了!',400,205,26,'#fc3','center');text(g,'🪙'+y(SG.pay||0)+' を獲得しました',400,245,22,'#fff','center')}
  else{text(g,'東京をスタートに、36か月プレイします。',400,205,18,'#fff','center');text(g,'サイコロ1回ごとに 🪙'+SGCOST+' かかります。',400,235,16,'#fff','center');
   text(g,'精算は (最終資産−1億円)÷20 をコインに換算(上限3,000)',400,262,14,'#9bd','center')}
  btn(g,260,350,280,64,'🚃 スタート',()=>sgStart(),'#d4a017',busy);
 }
 /* カード */
 if(SGK.panel=='cards'&&live){
  block();panelBox(g,100,80,600,440,'🃏 カード(タップで使用)');
  (SG.cards||[]).forEach((c,i)=>{const d=SGC[c.c];if(!d)return;btn(g,120+(i%2)*290,110+Math.floor(i/2)*56,280,48,d.name.slice(0,16)+' ×'+c.u,()=>{SGK.panel=null;d.ctype=='dice'?roll(c.c):useCard(c.c)},null,busy)});
  if(!(SG.cards||[]).length)text(g,'カードを持っていません',400,250,18,'#9bd','center');
  btn(g,300,460,200,48,'閉じる',()=>{SGK.panel=null},'#a33');
 }
 if(SGK.panel=='quit'&&live){
  block();panelBox(g,150,200,500,200,'精算して終了しますか?');
  btn(g,190,320,200,56,'はい',()=>{SGK.panel=null;quit()},'#a33');btn(g,410,320,200,56,'いいえ',()=>{SGK.panel=null});
 }
 /* リール・演出 */
 if(SGK.reel){g.fillStyle='rgba(0,0,30,.85)';g.fillRect(100,230,600,130);g.strokeStyle=SGK.reel.fin?'#fc3':'#8cf';g.lineWidth=4;g.strokeRect(100,230,600,130);
  text(g,'🎰',400,270,28,'#fff','center');text(g,String(SGK.reel.txt).slice(0,28),400,330,SGK.reel.fin?34:28,SGK.reel.fin?'#fc3':'#fff','center')}
 if(SGK.dice!=null&&!dg){text(g,'🎲 '+SGK.dice,400,200,72,'#fff','center')}
 if(SGK.big){g.fillStyle='rgba(60,20,90,.88)';g.fillRect(60,250,680,100);text(g,SGK.big,400,312,26,'#ffd',  'center')}
 if(SGK.toast&&Date.now()<SGK.toast.u){g.fillStyle='rgba(0,0,0,.75)';g.fillRect(100,66,600,36);text(g,SGK.toast.t.slice(0,46),400,91,16,'#fff','center')}
}
async function reelAnim(items,pick){
 for(let i=0;i<18;i++){SGK.reel={txt:items[Math.floor(Math.random()*items.length)],fin:false};beep(500+i*20,.04,'square',.03);await sleep(80)}
 SGK.reel={txt:items[pick],fin:true};fanfare();await sleep(900);SGK.reel=null;
}
async function playRes(d){
 SGK.dice=d.d!=null?d.d:null;
 for(const p of (d.path||[])){MP=p;beep(300+Math.random()*100,.05,'square',.03);await sleep(150)}
 MP=null;SG=d;
 for(const e of (d.ev||[])){SGLOG.unshift(e.msg);SGK.toast={t:e.msg,u:Date.now()+2600};if(e.items)await reelAnim(e.items,e.pick);else await sleep(600)}
 SGLOG=SGLOG.slice(0,14);SGK.dice=null;
 await refresh();
}
async function sgStart(){if(SGBUSY)return;SGBUSY=true;try{const {data,error}=await sb.rpc('sg_start');if(error)throw error;SG=data;SGLOG=['東京からスタート!'];SGK.ov=false;await refresh()}catch(e){alert(e.message)}SGBUSY=false}
async function roll(c){if(SGBUSY)return;SGBUSY=true;try{const {data,error}=await sb.rpc('sg_roll',{p_card:c||null});if(error)throw error;await playRes(data)}catch(e){SGK.toast={t:e.message,u:Date.now()+3500}}SGBUSY=false}
async function useCard(c){if(SGBUSY)return;SGBUSY=true;try{const {data,error}=await sb.rpc('sg_use_card',{p_card:c});if(error)throw error;await playRes(data)}catch(e){SGK.toast={t:e.message,u:Date.now()+3500}}SGBUSY=false}
async function dgRoll(){
 if(SGBUSY)return;SGBUSY=true;
 try{const {data,error}=await sb.rpc('sg_dg_roll');if(error)throw error;
  for(let i=0;i<10;i++){SGK.dice=1+Math.floor(Math.random()*6);beep(400,.04,'square',.03);await sleep(70)}
  SGK.dice=data.r;await sleep(500);SGLOG.unshift('🎲'+data.r+' '+data.msg);SGK.toast={t:data.msg,u:Date.now()+2600};
  if(data.forgive){SGK.big='✨ 女神はまだあなたを見捨ててはいない......';beep(880,.5,'sine',.08);await sleep(1800);SGK.big=null}
  if(data.end)fanfare();
  SG=data;SGK.dice=null;await refresh();
 }catch(e){SGK.toast={t:e.message,u:Date.now()+3500}}SGBUSY=false;
}
async function quit(){if(SGBUSY)return;SGBUSY=true;try{const {data,error}=await sb.rpc('sg_quit');if(error)throw error;SG=data;await refresh()}catch(e){SGK.toast={t:e.message,u:Date.now()+3500}}SGBUSY=false}
</script></body></html>
