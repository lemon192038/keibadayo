/* ---------- 効果音(WebAudio) ---------- */
let AC=null;
function ac(){
 if(!SND)return null;
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state=='suspended')AC.resume();
  return AC;
 }catch(e){return null}
}
document.addEventListener('pointerdown',()=>{if(SND)ac()});
function beep(f,d,type,vol,delay){
 const a=ac();if(!a)return;
 const t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
 o.type=type||'square';o.frequency.value=f;
 g.gain.setValueAtTime(vol||.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
 o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.02);
}
function noise(d,vol,delay){
 const a=ac();if(!a)return;
 const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
 for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);
 const s=a.createBufferSource(),g=a.createGain();
 s.buffer=b;g.gain.value=vol||.05;s.connect(g);g.connect(a.destination);s.start(a.currentTime+(delay||0));
}

function startTut(){TUT.on=true;TUT.step=0;showTut()}
function showTut(){
 const el=$('#tut');
 if(!TUT.on){el.innerHTML='';document.body.style.paddingBottom='0';return}
 const s=TS[TUT.step],last=TUT.step==TS.length-1;
 if(st.tab!=s[0])setTab(s[0]);
 el.innerHTML='<button id=tsk onclick="endTut()">⏭ チュートリアルをスキップ</button>'
  +'<div id=tp><b>'+(TUT.step+1)+' / '+TS.length+'　'+s[1]+'</b><div>'+s[2]+'</div>'
  +'<button onclick="tutGo(-1)">◀ 戻る</button><button class=on onclick="tutGo(1)">'+(last?'完了':'次へ ▶')+'</button></div>';
 document.body.style.paddingBottom='240px';
}
function tutGo(d){
 if(TUT.step+d>=TS.length){endTut();return}
 TUT.step=Math.max(0,TUT.step+d);showTut();
}
async function endTut(){
 TUT.on=false;showTut();
 if(D.p&&!D.p.tut_done){D.p.tut_done=true;await sb.rpc('finish_tutorial')}
}

/* ---------- オッズ計算(サーバーと同じ式) ---------- */
const es=r=>[...r.entries].sort((a,b)=>a.gate-b.gate);
function PLp(r){const E=es(r),t=E.reduce((a,e)=>a+Number(e.str),0);return E.map(e=>Number(e.str)/t)}
function sq(p,o){let r=1,rem=1;for(let k=0;k<o.length;k++){const q=p[o[k]-1];r*=q/rem;rem-=q}return r}
function perm3(p,a,b,c){return sq(p,[a,b,c])+sq(p,[a,c,b])+sq(p,[b,a,c])+sq(p,[b,c,a])+sq(p,[c,a,b])+sq(p,[c,b,a])}
function topP(p,a,k){
 const n=p.length;let pr=p[a-1];
 if(k>=2)for(let b=1;b<=n;b++)if(b!=a)pr+=p[b-1]*p[a-1]/(1-p[b-1]);
 if(k>=3)for(let b=1;b<=n;b++)if(b!=a)for(let c=1;c<=n;c++)if(c!=a&&c!=b)pr+=p[b-1]*(p[c-1]/(1-p[b-1]))*(p[a-1]/(1-p[b-1]-p[c-1]));
 return pr;
}
function oddsOf(r,typ,pk){
 const p=PLp(r),n=p.length,a=pk[0],b=pk[1],c=pk[2];let pr=0;
 if(typ=='win')pr=p[a-1];
 else if(typ=='place')pr=topP(p,a,n>=8?3:2);
 else if(typ=='exacta')pr=sq(p,[a,b]);
 else if(typ=='quinella')pr=sq(p,[a,b])+sq(p,[b,a]);
 else if(typ=='wide'){for(let d=1;d<=n;d++)if(d!=a&&d!=b)pr+=perm3(p,a,b,d)}
 else if(typ=='trifecta')pr=sq(p,[a,b,c]);
 else pr=perm3(p,a,b,c);
 return Math.min(9999,Math.max(1.0,Math.round(8/pr)/10));
}

function setType(t){sel.type=t;sel.picks=[];render()}
function pick(g){
 const i=sel.picks.indexOf(g),k=K[sel.type];
 if(i>=0)sel.picks.splice(i,1);
 else if(sel.box||sel.picks.length<k)sel.picks.push(g);
 render();
}
function combos(a,k,ord){
 const out=[];
 if(k==1){a.forEach(x=>out.push([x]));return out}
 if(k==2){
  for(let i=0;i<a.length;i++)for(let j=0;j<a.length;j++){if(i==j)continue;if(!ord&&i>j)continue;out.push([a[i],a[j]])}
  return out;
 }
 for(let i=0;i<a.length;i++)for(let j=0;j<a.length;j++)for(let l=0;l<a.length;l++){
  if(i==j||j==l||i==l)continue;
  if(!ord&&!(i<j&&j<l))continue;
  out.push([a[i],a[j],a[l]]);
 }
 return out;
}
function addCart(){
 const k=K[sel.type],ord=!!ORD[sel.type];
 if(sel.picks.length<k||(!sel.box&&sel.picks.length!=k)){alert(k+'頭選んでください');return}
 let list=sel.box?combos(sel.picks,k,ord):[[...sel.picks]];
 if(!ord)list=list.map(p=>[...p].sort((a,b)=>a-b));
 list=list.filter(p=>!cart.some(c=>c.t==sel.type&&c.p.join()==p.join()));
 if(cart.length+list.length>60){alert('カートは最大60点です(追加すると'+(cart.length+list.length)+'点になります)');return}
 list.forEach(p=>cart.push({t:sel.type,p}));
 sel.picks=[];render();
}
async function buyCart(){
 if(!cart.length)return;
 const total=sel.amt*cart.length;
 if(total>=1000000&&!confirm('合計 🪙'+y(total)+' を賭けます。よろしいですか?'))return;
 const {data,error}=await sb.rpc('place_bets',{rid:sel.rid,items:cart.map(c=>({t:c.t,p:c.p})),amt:sel.amt});
 if(error)alert(error.message);
 else{alert(data+'点購入しました!(合計🪙'+y(data*sel.amt)+')');cart=[];sel.picks=[]}
 load();
}

/* 一括売却・引退 */
function bkCands(){
 const lim=RKI[BK.max];
 const O=openList();
 const entered=new Set(O.flatMap(r=>r.entries.map(e=>e.horse_id)));
 return D.horses.filter(h=>h.owner==me.id&&!h.sure&&!entered.has(h.id)&&(BK.mode=='sell'||!h.retired)
  &&(h.grk?RKI[h.grk]<=lim:BK.max=='UR'));
}
function bulk(){
 const L=bkCands();
 if(!BK.sel)BK.sel=null;
 const chosen=L.filter(h=>!BK.ex.has(h.id));
 const gain=chosen.reduce((a,h)=>a+Math.floor(h.price*0.6),0);
 let h='<div class=card><h3>🧹 一括売却・一括引退</h3>'
  +'<div><button class="'+(BK.mode=='sell'?'on':'')+'" onclick="BK.mode=\'sell\';BK.ex=new Set();render()">売却</button>'
  +'<button class="'+(BK.mode=='retire'?'on':'')+'" onclick="BK.mode=\'retire\';BK.ex=new Set();render()">引退</button></div>'
  +'<div>対象のランク(これ以下): <select onchange="BK.max=this.value;BK.ex=new Set();render()">'
  +['N','R','RR','RRR','SR','SSR','HR','UR'].map(r=>'<option'+(BK.max==r?' selected':'')+'>'+r+'</option>').join('')+'</select></div>'
  +'<p><small>ガチャで出た馬は、そのランクで判定します。ランクのない馬(購入した馬や仔馬など)は、「UR」を選んだときだけ対象になります。出走登録中の馬と、必勝馬は、対象外です。</small></p>'
  +'<p>候補 '+L.length+'頭 / 実行する '+chosen.length+'頭'+(BK.mode=='sell'?' / 売却額の合計 <b class=c>🪙'+y(gain)+'</b>':'')+'</p>';
 if(L.length){
  h+='<div class=sc><table><tr><th>実行<th>馬名<th>ランク<th>クラス<th>価格</tr>'
   +L.map(x=>'<tr><td><input type=checkbox '+(BK.ex.has(x.id)?'':'checked')+' onchange="bkTog('+x.id+')"><td>'+esc(x.name)+'<td>'+(x.grk?rkt(x.grk):'—')+'<td>'+(x.cls||'—')+'<td>'+y(x.price)+'</tr>').join('')+'</table></div>'
   +'<p><small>チェックを外した馬は、除外されます。</small></p>'
   +(chosen.length?'<button class=s onclick="doBulk()">'+(BK.mode=='sell'?'🗑 '+chosen.length+'頭を売却する':'🛌 '+chosen.length+'頭を引退させる')+'</button>':'');
 }else h+='<p>対象の馬がいません。</p>';
 return h+'</div>';
}
function bkTog(id){if(BK.ex.has(id))BK.ex.delete(id);else BK.ex.add(id);render()}
async function doBulk(){
 const ids=bkCands().filter(h=>!BK.ex.has(h.id)).map(h=>h.id);
 if(!ids.length)return;
 if(!confirm(ids.length+'頭を'+(BK.mode=='sell'?'売却':'引退')+'します。元に戻せません。よろしいですか?'))return;
 const {data,error}=await sb.rpc('bulk_horses',{p_mode:BK.mode,p_ids:ids});

function playGacha(res,after){
 const best=res.reduce((a,b)=>RKI[b.rk]>RKI[a.rk]?b:a);

 const T=[],later=(ms,f)=>T.push(setTimeout(f,ms));

 orb.style.setProperty('--c',rev?RKC.N:(hi?'#fc3':RKC[best.rk]));
 const flash=()=>{const f=document.createElement('div');f.className='flash';ov.appendChild(f);setTimeout(()=>f.remove(),800)};

 ov.onclick=()=>{if(!fin)reveal()};
 later(0,()=>SFX.gate());
 later(700,()=>{msg.textContent='…！';SFX.rise()});
 if(rev){

/* ---------- レース映像 ---------- */
const SC={'逃げ':{k:.72,d:0},'先行':{k:1.3,d:.5},'差し':{k:2.3,d:2},'追込':{k:3.4,d:4.2}};
const COL=['#fff','#222','#e33','#36e','#fd2','#2b4','#f93','#f7b','#a5f','#6dd','#a63','#999'];
const TR={cx:200,cy:116,S:170,R:60,W:19};
const TL=2*TR.S+2*Math.PI*TR.R;
const GATE_OPEN=1;
function stad(g,r){const {cx,cy,S}=TR;g.beginPath();g.moveTo(cx-S/2,cy+r);g.lineTo(cx+S/2,cy+r);
 g.arc(cx+S/2,cy,r,Math.PI/2,-Math.PI/2,true);g.lineTo(cx-S/2,cy-r);g.arc(cx-S/2,cy,r,-Math.PI/2,Math.PI/2,true);g.closePath()}
function tpos(s,off){
 s=((s%TL)+TL)%TL;const {cx,cy,S,R}=TR,r=R+off;
 if(s<S)return [cx-S/2+s,cy+r];
 s-=S;
 if(s<Math.PI*R){const a=Math.PI/2-s/R;return [cx+S/2+r*Math.cos(a),cy+r*Math.sin(a)]}
 s-=Math.PI*R;
 if(s<S)return [cx+S/2-s,cy-r];
 s-=S;const a=-Math.PI/2-s/R;return [cx-S/2+r*Math.cos(a),cy+r*Math.sin(a)];
}
function prog(e,t,Tf,cap){
 const m=SC[e.style]||SC['先行'],d=Math.min(m.d,Tf-6);
 const u=Math.min(1,Math.max(0,(t-d)/(Tf-d)));
 let p=Math.pow(u,m.k);
 p+=Math.sin(t*2.3+e.gate*1.7)*.006*(1-u)*Math.min(1,u*5);
 if(t>Tf)p=1+Math.min(cap,(t-Tf)*.02);
 return Math.max(0,p);
}
function drawHorse(g,x,y,a,col,fr){
 g.save();g.translate(Math.round(x),Math.round(y));g.rotate(a);
 g.fillStyle='#2a160a';
 g.fillRect(fr?-3:-4,-2,1,1);g.fillRect(fr?1:2,-2,1,1);g.fillRect(fr?-4:-3,2,1,1);g.fillRect(fr?2:1,2,1,1);
 g.fillStyle='#4a2a14';g.fillRect(-4,-1,7,3);
 g.fillStyle='#5c361b';g.fillRect(3,-1,3,2);
 g.fillStyle='#2a160a';g.fillRect(-6,0,2,1);
 g.fillStyle=col;g.fillRect(-2,-1,3,3);
 g.restore();
}
function drawGate(g,s0,n,t){
 const {W}=TR,P=tpos(s0,0),Q=tpos(s0+1,0),a=Math.atan2(Q[1]-P[1],Q[0]-P[0]);
 g.save();g.translate(Math.round(P[0]),Math.round(P[1]));g.rotate(a);
 g.fillStyle='#8a93a6';g.fillRect(-10,-W,1,2*W);
 g.fillStyle='#b9c0d0';g.fillRect(-10,-W,18,1);g.fillRect(-10,W-1,18,1);
 const sp=n>1?2*(W-5)/(n-1):2*(W-5);
 g.globalAlpha=.45;g.fillStyle='#d6dbe6';
 for(let k=0;k<=n;k++){g.fillRect(-10,Math.round(-(W-5)-sp/2+k*sp),17,1)}
 g.globalAlpha=1;
 if(t<GATE_OPEN){g.fillStyle='#e33';g.fillRect(7,-W,1,2*W)}
 else{g.fillStyle='#e33';g.fillRect(7,-W,3,1);g.fillRect(7,W-1,3,1)}
 g.restore();
}

 const g=c.getContext('2d');g.imageSmoothingEnabled=false;
 const t=(Date.now()-new Date(r.start_at))/1000,{cx,cy,S,R,W}=TR;
 g.textAlign='left';
 g.fillStyle='#b59a68';g.fillRect(0,0,400,232);
 g.fillStyle='#8c2f2f';g.fillRect(28,5,344,12);g.fillStyle='#c98a8a';g.fillRect(28,5,344,3);

 g.strokeStyle='#fff';g.lineWidth=1;stad(g,R+W);g.stroke();stad(g,R-W);g.stroke();
 const total=TL*.9,fs=S*.85,s0=fs-total,fx=cx-S/2+fs;
 for(let k=-W;k<W;k+=2){g.fillStyle=((k+W)/2)%2?'#000':'#fff';g.fillRect(Math.round(fx),cy+R+k,2,2)}
 const E=es(r),n=E.length;
 drawGate(g,s0,n,t);
 const H=E.map((e,i)=>{
  const pl=Math.max(0,r.result.indexOf(e.gate)),Tf=20+pl*.45;
  const p=prog(e,t-GATE_OPEN,Tf,pl==0?.15:.05);
  const off=-(W-5)+2*(W-5)*(n>1?i/(n-1):.5)+Math.sin(t*1.7+i)*1.2;
  return {e,i,p,off,pl,Tf};
 });
 H.forEach(h=>{
  const s=s0+h.p*total,P=tpos(s,h.off),Q=tpos(s+1,h.off);
  h.x=P[0];h.y=P[1];
  drawHorse(g,P[0],P[1],Math.atan2(Q[1]-P[1],Q[0]-P[0]),COL[(h.e.gate-1)%12],Math.floor(t*9+h.i)%2);
 });
 const win=H.find(h=>h.pl==0),tw=win?t-GATE_OPEN-win.Tf:-1;
 const rk=[...H].sort((a,b)=>(b.p>=1?100-b.pl:b.p)-(a.p>=1?100-a.pl:a.p)),lead=Math.max(...H.map(h=>h.p));
 if(CM.rid!=r.id)CM={rid:r.id,flags:{},lines:[],v:0,leader:0,lp:0,lt:0,sp:0,beat:0,snap:null,say:0};
 const F=CM.flags,tn_=Date.now(),nm=h=>h.e.gate+'番 '+h.e.name+(h.e.jockey_id?'('+jn(h.e.jockey_id)+')':'');
 if(t-CM.lt>=.5){CM.sp=(lead-CM.lp)/(t-CM.lt);CM.lp=lead;CM.lt=t}
 if(t>=.2&&!F.gin){F.gin=1;say('各馬、ゲートに収まりました。',0);SFX.gate()}
 if(t>=GATE_OPEN&&!F.st){F.st=1;say('ゲートが開いた! 一斉にスタート!',1);SFX.start()}
 if(F.st&&t>GATE_OPEN+1.5&&lead<.68&&tn_-CM.say>2000){
  const L=rk[0];
  if(L.e.gate!=CM.leader){say(CM.leader?'先頭が入れ替わった! '+nm(L)+'!':'飛び出したのは '+nm(L)+'!',0);CM.leader=L.e.gate;CM.say=tn_}
 }
 if(t>GATE_OPEN+6&&!F.pace){F.pace=1;say(CM.sp>.05?'ペースは速い! 先頭集団はハイペース!':'ペースは落ち着いている。各馬、脚を溜めています。',0)}
 if(lead>.68&&!F.cor){F.cor=1;CM.snap={};rk.forEach((h,i)=>{CM.snap[h.e.gate]=i});say('最終コーナーに差しかかる! 後方の馬が動き出す!',1)}
 if(lead>.776&&!F.str){F.str=1;say('さあ直線に入った!!',1);SFX.stretch()}
 if(lead>.84&&!F.chg&&CM.snap){
  F.chg=1;let best=null,gn=0;
  rk.forEach((h,i)=>{const d=CM.snap[h.e.gate]-i;if(d>gn){gn=d;best=h}});
  if(best&&gn>=2)say(nm(best)+' が大外から猛追! '+gn+'頭をごぼう抜き!!',1);
 }
 if(lead>.92&&!F.fin){F.fin=1;say(nm(rk[0])+' 先頭! 後続が迫る!!',1)}
 if(win&&lead>=1&&!F.goal){
  F.goal=1;say('ゴール!! 1着は '+nm(win)+'!',1);SFX.goal();
  if(win.e.owner==me.id)say('🎉 あなたの '+win.e.name+' が勝った!',1);
 }
 if(win&&F.goal&&tw>1.8&&!F.res){
  F.res=1;const by=[...H].sort((a,b)=>a.pl-b.pl);
  if(by[1]&&by[2])say('2着 '+nm(by[1])+' / 3着 '+nm(by[2]),0);
 }
 if(F.st&&lead<1&&tn_>CM.beat){SFX.hoof();CM.beat=tn_+Math.max(110,300-CM.sp*2400)}
 cmShow();
 g.font='bold 10px monospace';
 rk.slice(0,4).forEach((h,k)=>{
  g.fillStyle=COL[(h.e.gate-1)%12];g.fillRect(cx-62,cy-6+k*11,6,6);
  g.fillStyle='#fff';g.fillText((k+1)+' '+String(h.e.name).slice(0,8),cx-53,cy-0+k*11);
 });
 const msg=lead>=1?'ゴール!':t<GATE_OPEN?'ゲートイン':t<2.5?'スタート!':lead>.776?'最終直線!!':lead>.68?'最終コーナー':'';
 if(msg){g.font='bold 14px monospace';g.fillStyle='#000';g.fillText(msg,cx-36,cy-24);g.fillStyle='#ff0';g.fillText(msg,cx-37,cy-25)}
 if(win&&tw>0){
  const pulse=Math.sin(tw*8)>0;
  g.strokeStyle=pulse?'#ffd700':'#fff';g.lineWidth=2;
  g.beginPath();g.arc(Math.round(win.x),Math.round(win.y),7+Math.sin(tw*6)*1.5,0,7);g.stroke();
  for(let k=0;k<46;k++){
   const px=(k*97+Math.sin(tw*2+k)*8+400)%400,py=(tw*38+k*53)%232;
   g.fillStyle=COL[(k+2)%12];g.fillRect(Math.round(px),Math.round(py),2,2);
  }
  g.fillStyle='#000';g.fillRect(40,201,320,26);
  g.fillStyle='#d4a017';g.fillRect(42,203,316,22);
  g.fillStyle=pulse?'#fff7c2':'#ffd700';g.fillRect(42,203,316,3);
  g.font='bold 13px monospace';g.textAlign='center';
  g.fillStyle='#000';g.fillText('🏆 1着 '+win.e.gate+'番 '+String(win.e.name).slice(0,16),200,219);
  g.textAlign='left';
 }
},50);

 if(!me||!D.p||GB)return;

 if(r){vidId=r.id}
 else if(vidId){

 }
 if((st.tab=='race'||st.tab=='watch')&&st.tab=='watch'&&!!r!==!!$('#cv'))render();

 TICKING=true;

 load();

 if(me&&!GB&&(st.tab=='race'||st.tab=='watch'||(tg!='INPUT'&&tg!='SELECT')))load();
 if(me&&st.tab=='shop'&&IT.shop&&Math.floor(Date.now()/3.6e6)!=IT.shop.hr)loadShop();
},4000);
setInterval(()=>{if(me&&st.tab=='chat')loadChat()},3000);
