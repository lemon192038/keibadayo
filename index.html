<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><title>G1 World Classic Glory</title>
<style>
body{margin:0;font:16px -apple-system,sans-serif;background:#10231a;color:#eee}
header,nav{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#0a1810;flex-wrap:wrap}header b{flex:1}
button{font-size:16px;padding:10px 14px;margin:3px;border:0;border-radius:8px;background:#2d5a44;color:#fff}
button.on{background:#d4a017;color:#000}button.s{background:#a33}.c{color:#ffd34d;font-weight:700}
main{padding:10px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid #2a4}
.box{max-width:360px;margin:15vh auto;text-align:center}input{font-size:18px;padding:10px;margin:6px;width:80%;border-radius:8px;border:0}
.card{background:#183626;border-radius:10px;padding:10px;margin:8px 0}
.n{display:inline-block;min-width:26px;text-align:center;border-radius:50%;background:#fff;color:#000}
.sel{background:#d4a017;color:#000}canvas{width:100%;border-radius:8px}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://cntqlqvnruanmawtxiyp.supabase.co';
const KEY='sb_publishable_28BRrTAEoLeyOgcOCvc9FA_hg5Ej2wC';
const sb=supabase.createClient(SB_URL,KEY);
const $=s=>document.querySelector(s);
const y=n=>Number(n).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TN={win:'単勝',exacta:'馬単',quinella:'馬連',trifecta:'3連単',trio:'3連複'};
const K={win:1,exacta:2,quinella:2,trifecta:3,trio:3};
const RS=30e3;
let me=null,bonusDone=false;
let D={p:null,races:[],horses:[],bets:[],last:null};
let st={tab:'race'};
let sel={rid:0,type:'win',picks:[],amt:100};

/* ---------- ログイン ---------- */
function login(){
 $('#app').innerHTML='<div class=box><h2>🏇 G1 World Classic Glory</h2>'
 +'<input id=u placeholder="アカウント名(英数字)"><input id=pw type=password placeholder="パスワード(6文字以上)">'
 +'<button onclick="auth(0)">ログイン</button><button onclick="auth(1)">新規登録(🪙10000プレゼント)</button></div>';
}
async function auth(su){
 const u=$('#u').value.trim(),password=$('#pw').value,email=u+'@gwc-game.com';
 const r=su?await sb.auth.signUp({email,password,options:{data:{name:u}}}):await sb.auth.signInWithPassword({email,password});
 if(r.error)alert(r.error.message);
}
sb.auth.onAuthStateChange((_,s)=>{
 me=s?s.user:null;
 if(me){setTimeout(load,0)}else{bonusDone=false;login()}
});

/* ---------- データ読み込み ---------- */
async function load(){
 if(!me)return;
 await sb.rpc('tick');
 if(!bonusDone){
  bonusDone=true;
  const bn=await sb.rpc('claim_bonus');
  if(bn.data>0)alert('🎁 ログインボーナス! 🪙'+bn.data+'獲得');
 }
 const [p,r,h,b]=await Promise.all([
  sb.from('profiles').select('*').eq('id',me.id).single(),
  sb.from('races').select('*,entries(*)').order('id',{ascending:false}).limit(6),
  sb.from('horses').select('*').order('price',{ascending:false}),
  sb.from('bets').select('*').order('id',{ascending:false}).limit(40)]);
 D={p:p.data,races:r.data||[],horses:h.data||[],bets:b.data||[],last:null};
 render();
}
async function act(fn,a){
 const {error}=await sb.rpc(fn,a);
 if(error)alert(error.message);
 load();
}

/* ---------- レース中の判定(結果は映像が終わるまで隠す) ---------- */
function running(){
 const dn=D.races.filter(r=>r.status=='done');
 return dn[0]&&Date.now()-new Date(dn[0].start_at)<RS?dn[0]:null;
}
function shown(){
 let c=Number(D.p.coins);
 const r=running();
 if(!r)return c;
 D.bets.filter(b=>b.race_id==r.id).forEach(b=>{c-=b.payout||0});
 (r.entries||[]).filter(e=>e.owner==me.id).forEach(e=>{
  const i=r.result.indexOf(e.gate);
  if(i>=0&&i<3)c-=Math.round(r.prize*[1,.4,.2][i]);
 });
 return c;
}

/* ---------- 画面全体 ---------- */
function render(){
 if(!me||!D.p)return;
 const T={race,zukan,stable,bets,code,gacha};
 const tabs=[['race','レース'],['zukan','馬図鑑・購入'],['stable','馬房'],['bets','馬券履歴'],['code','🎟コード'],['gacha','🎰馬ガチャ']];
 $('#app').innerHTML='<header><b>🏇 GWCG</b><span>'+esc(D.p.name)+'</span><span class=c>🪙'+y(shown())+'</span>'
 +'<button onclick="sb.auth.signOut()">ログアウト</button></header>'
 +'<nav>'+tabs.map(t=>'<button class="'+(st.tab==t[0]?'on':'')+'" onclick="st.tab=\''+t[0]+'\';render()">'+t[1]+'</button>').join('')+'</nav>'
 +'<main>'+T[st.tab]()+'</main>';
 if(st.tab=='race')prev();
}

/* ---------- レース ---------- */
const es=r=>[...r.entries].sort((a,b)=>a.gate-b.gate);
function wo(r){
 const t=r.entries.reduce((a,e)=>a+Number(e.str),0);
 return e=>Math.min(9999,Math.max(1.1,Math.round(8/(Number(e.str)/t))/10));
}
function race(){
 const now=Date.now();
 const open=D.races.filter(r=>r.status=='open').sort((a,b)=>a.id-b.id);
 const cur=open[0];
 const dn=D.races.filter(r=>r.status=='done');
 D.last=running();
 const last=D.last?dn[1]:dn[0];
 let h='';
 if(cur){
  const left=(new Date(cur.start_at)-now)/1000;
  const ph=left>180?'出走登録受付中':left>15?'ベット受付中':'締切';
  if(sel.rid!=cur.id)sel={rid:cur.id,type:sel.type,picks:[],amt:sel.amt};
  const o=wo(cur),canBet=left<=180&&left>15;
  const rows=es(cur).map(e=>{
   const btn=canBet?'<td><button onclick="pick('+e.gate+')">選択</button>':'';
   return '<tr class="'+(sel.picks.includes(e.gate)?'sel':'')+'"><td><span class=n>'+e.gate+'</span><td>'+esc(e.name)+(e.owner==me.id?' ⭐':'')+'<td>'+esc(e.style)+'<td>'+o(e)+btn+'</tr>';
  }).join('');
  h+='<div class=card><h3>'+esc(cur.name)+' <small>(1着賞金🪙'+y(cur.prize)+')</small></h3>'
   +'<div>'+ph+':発走まで <b id=cd class=c></b></div>'
   +'<table><tr><th>枠<th>馬名<th>脚質<th>単勝</tr>'+rows+'</table></div>';
  if(canBet){
   h+='<div class=card>'
    +Object.keys(TN).map(t=>'<button class="'+(sel.type==t?'on':'')+'" onclick="sel.type=\''+t+'\';sel.picks=[];render()">'+TN[t]+'</button>').join('')
    +'<div>買い目('+K[sel.type]+'頭を'+(sel.type=='win'?'選択':'着順どおりに選択')+'): <b>'+(sel.picks.join(' → ')||'未選択')+'</b> <span class=c id=od></span></div>'
    +[100,500,1000,5000].map(a=>'<button class="'+(sel.amt==a?'on':'')+'" onclick="sel.amt='+a+';render()">'+a+'</button>').join('')
    +'<button onclick="bet()">🎫 ベットする(🪙'+y(sel.amt)+')</button></div>';
  }else if(left>180){
   h+='<p>⏳ 馬房タブから所有馬を出走登録できます(登録料200コイン)。</p>';
  }
 }
 if(D.last){
  h+='<div class=card><h3>🏁 レース中:'+esc(D.last.name)+'</h3><canvas id=cv></canvas><p>結果発表をお待ちください…</p></div>';
 }
 if(last){
  h+='<div class=card><h3>前回結果:'+esc(last.name)+'</h3><table>'
   +last.result.map((g,i)=>{const e=last.entries.find(x=>x.gate==g);return '<tr><td>'+(i+1)+'着<td><span class=n>'+g+'</span> '+esc(e?e.name:'')+'</tr>'}).join('')
   +'</table>'
   +D.bets.filter(b=>b.race_id==last.id).map(b=>'<div>'+TN[b.type]+' '+b.picks.join('-')+' '+b.amount+'枚 '+b.odds+'倍 → <b class=c>'+(b.settled?'🪙'+y(b.payout):'集計中')+'</b></div>').join('')
   +'</div>';
 }
 return h;
}
function pick(g){
 const i=sel.picks.indexOf(g);
 if(i>=0)sel.picks.splice(i,1);
 else if(sel.picks.length<K[sel.type])sel.picks.push(g);
 render();
}
async function prev(){
 if(sel.picks.length==K[sel.type]&&$('#od')){
  const {data}=await sb.rpc('calc_odds',{rid:sel.rid,typ:sel.type,pk:sel.picks});
  if($('#od'))$('#od').textContent=data+'倍';
 }
}
async function bet(){
 const {data,error}=await sb.rpc('place_bet',{rid:sel.rid,typ:sel.type,pk:sel.picks,amt:sel.amt});
 if(error)alert(error.message);
 else{alert('ベット完了!オッズ '+data+'倍');sel.picks=[]}
 load();
}

/* ---------- 馬図鑑・馬房 ---------- */
const bar=(v,c)=>'<span style="display:inline-block;width:'+(v*.6)+'px;height:8px;background:'+c+'"></span> '+v;
function hrow(h,btn){
 const tw=h.wins_t+h.wins_d,tr=h.runs_t+h.runs_d;
 return '<tr><td>'+esc(h.name)+'<td>'+esc(h.style)+'<td>'+bar(h.spd,'#e55')+'<td>'+bar(h.sta,'#5b5')+'<td>'+bar(h.pow,'#59f')
 +'<td>'+h.turf+'/'+h.dirt+'<td>'+h.wins_t+'-'+h.runs_t+'<td>'+h.wins_d+'-'+h.runs_d
 +'<td>'+(tr?Math.round(tw/tr*100):0)+'%<td>'+((h.recent||[]).join(',')||'-')+'<td>'+h.fatigue+'<td>'+y(h.price)+'<td>'+btn+'</tr>';
}
const HEAD='<tr><th>馬名<th>脚質<th>スピード<th>スタミナ<th>パワー<th>芝/ダ適性<th>芝(勝-出)<th>ダ(勝-出)<th>勝率<th>近5走<th>疲労<th>価格<th></tr>';
function zukan(){
 return '<div style="overflow-x:auto"><table>'+HEAD+D.horses.map(h=>hrow(h,
  h.owner==me.id?'⭐所有':h.owner?'他人':'<button onclick="if(confirm(\'購入しますか?\'))act(\'buy_horse\',{hid:'+h.id+'})">購入</button>')).join('')+'</table></div>';
}
function stable(){
 const m=D.horses.filter(h=>h.owner==me.id);
 if(!m.length)return '<p>所有馬がいません。図鑑から購入するか、ガチャを引きましょう。</p>';
 return m.map(h=>{
  const nameBtn=h.named?'':'<button onclick="nameIt('+h.id+')">✏️名前をつける</button>';
  return '<div class=card><b>'+esc(h.name)+'</b> '+esc(h.style)+' 疲労'+h.fatigue+' 価格🪙'+y(h.price)+' 伸び×'+(h.growth||1)
  +'<div style="overflow-x:auto"><table>'+HEAD+hrow(h,'')+'</table></div>'
  +'<button onclick="act(\'train\',{hid:'+h.id+',stat:\'spd\'})">スピード強化300</button>'
  +'<button onclick="act(\'train\',{hid:'+h.id+',stat:\'sta\'})">スタミナ強化300</button>'
  +'<button onclick="act(\'train\',{hid:'+h.id+',stat:\'pow\'})">パワー強化300</button>'
  +nameBtn
  +'<button onclick="act(\'enter_horse\',{hid:'+h.id+'})">🏁 出走登録200</button>'
  +'<button class=s onclick="if(confirm(\'売却(価格の60%)\'))act(\'sell_horse\',{hid:'+h.id+'})">売却</button></div>';
 }).join('');
}

/* ---------- 馬券履歴 ---------- */
function bets(){
 const rn=running();
 return '<table><tr><th>レース<th>種別<th>買い目<th>金額<th>オッズ<th>払戻</tr>'
 +D.bets.map(b=>'<tr><td>'+(b.race_id%10000)+'<td>'+TN[b.type]+'<td>'+b.picks.join('-')+'<td>'+b.amount+'<td>'+b.odds
  +'<td>'+(b.settled&&!(rn&&rn.id==b.race_id)?y(b.payout):'待機中')+'</tr>').join('')+'</table>';
}

/* ---------- コード ---------- */
function code(){
 return '<div class=card><h3>🎟 コード入力</h3><p>コードを入力してください。</p>'
 +'<input id=cd2 placeholder="GWCG-XXXXXXXX" style="width:70%"><button onclick="redeem()">決定</button></div>';
}
async function redeem(){
 const v=$('#cd2').value;
 const {data,error}=await sb.rpc('redeem_code',{c:v});
 if(error)alert(error.message);else alert(String(data).replace(/^NG:/,''));
 load();
}

/* ---------- 馬ガチャ ---------- */
function gacha(){
 return '<div class=card><h3>🎰 馬ガチャ(1回 🪙5000)</h3>'
 +'<p>排出馬は能力が低い代わりに、調教での伸びが大きい馬です。</p>'
 +'<p>N 60% (伸び×3) / R 28% (×4) / SR 10% (×5) / SSR 2% (×7)</p>'
 +'<p>引いた馬は名前をつけられます。</p>'
 +'<button onclick="pull()">🎰 ガチャを引く(5000)</button></div>';
}
async function pull(){
 if(!confirm('5000コインで引きますか?'))return;
 const {data,error}=await sb.rpc('gacha');
 if(error){alert(error.message);return}
 const parts=String(data).split(':');
 await load();
 const nm=prompt('🎉 '+parts[0]+' の馬が出ました!\n名前をつけてください(1〜20文字)');
 if(nm&&nm.trim()){
  const r=await sb.rpc('name_horse',{hid:Number(parts[1]),nm:nm});
  if(r.error)alert(r.error.message);
  load();
 }else{
  alert('あとで「馬房」タブから名前をつけられます');
 }
}
async function nameIt(id){
 const nm=prompt('名前をつけてください(1〜20文字・変更は1回だけ)');
 if(nm&&nm.trim()){
  const r=await sb.rpc('name_horse',{hid:id,nm:nm});
  if(r.error)alert(r.error.message);
  load();
 }
}

/* ---------- レース映像 ---------- */
const SP={'逃げ':.85,'先行':.95,'差し':1.08,'追込':1.2};
setInterval(()=>{
 const c=$('#cv'),r=D.last;
 if(!c||!r)return;
 const E=es(r),g=c.getContext('2d');
 c.width=760;c.height=E.length*26+10;
 const t=(Date.now()-new Date(r.start_at))/1000;
 g.font='13px sans-serif';
 E.forEach((e,i)=>{
  const T=18+r.result.indexOf(e.gate)*.5;
  const u=Math.min(1,Math.max(0,t/T));
  const x=40+Math.pow(u,SP[e.style]||1)*620,yy=i*26+16;
  g.fillStyle=r.surface=='芝'?'#2f7a3a':'#8a6a3c';g.fillRect(0,yy-11,760,22);
  g.fillStyle='#fff';g.fillRect(670,yy-11,3,22);
  g.beginPath();g.arc(x,yy,10,0,7);g.fillStyle='#f5c518';g.fill();
  g.fillStyle='#000';g.fillText(e.gate,x-4,yy+4);
  g.fillStyle='#fff';g.fillText(e.name,x+14,yy+4);
 });
},60);

/* ---------- カウントダウンと自動更新 ---------- */
setInterval(()=>{
 const c=$('#cd'),o=D.races.filter(r=>r.status=='open').sort((a,b)=>a.id-b.id)[0];
 if(c&&o){
  const s=Math.max(0,Math.floor((new Date(o.start_at)-Date.now())/1000));
  c.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
 }
},500);
setInterval(()=>{if(D.last&&!running()){D.last=null;render()}},1000);
setInterval(()=>{if(me&&document.activeElement.tagName!='INPUT')load()},4000);
</script></body></html>
